name: Релиз

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Версия
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Проверка кода
        run: |
          node --check main.js
          node --check bot.js
          node --check preload.js
      - name: Сборка установщика и релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish always
      - name: Описание релиза
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          MSG="$(git log -1 --pretty=%s)"
          gh release edit "v$VER" --title "CyberSite $VER" --latest --notes "$MSG

          Скачай **CyberSite-Setup-$VER.exe** и запусти. Дальше программа обновляется сама.
          Настройки хранятся в %APPDATA%\\CyberSite и при обновлении не сбрасываются."
